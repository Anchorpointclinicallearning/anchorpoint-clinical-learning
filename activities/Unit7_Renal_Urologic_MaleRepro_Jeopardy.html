<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 7 Renal Jeopardy</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06142f,#102b63);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:1450px;margin:auto;padding:16px}.title{text-align:center;color:#ffd54f;font-size:clamp(28px,4vw,52px);font-weight:950;text-shadow:0 3px #000}.sub{text-align:center;color:#9cecf3;font-size:18px;font-weight:800;margin:5px 0 14px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.team{background:#0b2148;border:2px solid #1f6ba7;border-radius:12px;padding:9px;text-align:center}.team input{width:100%;background:transparent;border:0;border-bottom:1px solid #ffffff55;color:white;text-align:center;font-weight:900;font-size:17px}.score{font-size:28px;color:#ffd54f;font-weight:950;margin:5px}.mini button{margin:2px;border:0;border-radius:7px;padding:6px 10px;font-weight:900;cursor:pointer}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.cat{background:#7136b6;padding:12px 5px;text-align:center;font-weight:950;min-height:70px;display:flex;align-items:center;justify-content:center;border-radius:6px}.tile{background:#087c96;color:#ffd54f;border:0;border-radius:6px;min-height:83px;font-size:30px;font-weight:950;cursor:pointer;text-shadow:0 2px #000}.tile.used{background:#182c45;color:#60748d;cursor:default}.actions{text-align:center;margin:12px}.actions button,.btn{border:0;border-radius:8px;padding:10px 14px;margin:3px;font-weight:900;cursor:pointer}.reset{background:#d81b60;color:white}.modal{display:none;position:fixed;inset:0;background:#020817ee;padding:18px;overflow:auto;z-index:10}.card{max-width:950px;margin:4vh auto;background:#0b2148;border:3px solid #ffd54f;border-radius:18px;padding:24px;text-align:center}.value{color:#ffd54f;font-size:25px;font-weight:950}.question{font-size:clamp(22px,3vw,34px);font-weight:900;line-height:1.3;margin:22px 0}.answer{display:none;background:white;color:#10203b;border-radius:12px;padding:17px;margin:15px 0;font-size:21px}.answer .teach{font-size:16px;margin-top:9px;line-height:1.4}.reveal{background:#ffd54f;color:#111}.correct{background:#2da45c;color:#fff}.wrong{background:#d93b50;color:#fff}.pass{background:#7b42d1;color:#fff}.back{background:#2496b5;color:#fff}.teamRow{margin:7px}.winner{font-size:24px;color:#ffd54f;font-weight:950}@media(max-width:800px){.board{grid-template-columns:repeat(5,minmax(110px,1fr));overflow:auto}.scores{grid-template-columns:1fr}.wrap{padding:7px}}
</style></head><body><div class="wrap"><div class="title">PATHOPHYSIOLOGY JEOPARDY!</div><div class="sub">Unit 7 • Renal & Urologic Systems + Male Reproductive System</div><div class="scores" id="scores"></div><div class="board" id="board"></div><div class="actions"><button class="btn reset" id="reset">RESET GAME</button><button class="btn back" id="winner">SHOW WINNER</button></div><div id="wintext" class="winner" style="text-align:center"></div></div>
<div class="modal" id="modal"><div class="card"><div id="mvalue" class="value"></div><div id="mq" class="question"></div><button id="reveal" class="btn reveal">REVEAL ANSWER</button><div id="ans" class="answer"><b id="ma"></b><div id="note" class="teach"></div></div><div id="grading" style="display:none"></div><button id="back" class="btn back">BACK TO BOARD</button></div></div>
<script>const DATA=[{"name": "AKI: WHERE'S THE PROBLEM?", "questions": [{"value": 100, "q": "What are the three major categories of acute kidney injury?", "a": "Prerenal, intrinsic, and postrenal AKI.", "note": "Think of AKI as a location problem: blood is not reaching the kidney, the kidney itself is damaged, or urine cannot leave."}, {"value": 200, "q": "A patient becomes severely dehydrated and renal blood flow drops. Which category of AKI should you suspect first?", "a": "Prerenal AKI.", "note": "Prerenal AKI begins with inadequate kidney perfusion."}, {"value": 300, "q": "Nephrotoxic injury or acute tubular necrosis belongs to which AKI category?", "a": "Intrinsic AKI.", "note": "Intrinsic AKI reflects direct injury to kidney tissue."}, {"value": 400, "q": "A patient has an enlarged prostate and cannot empty the bladder. Which AKI category is most likely?", "a": "Postrenal AKI.", "note": "Obstruction creates back pressure that reduces glomerular filtration."}, {"value": 500, "q": "A postoperative patient has rising creatinine, a bladder scan showing 900 mL retained urine, and creatinine improves after catheterization. What mechanism best explains the kidney injury?", "a": "Postrenal obstruction from urinary retention.", "note": "Relieving the obstruction restores urine flow and can improve filtration when the kidney tissue is still viable."}]}, {"name": "AKI OR CKD?", "questions": [{"value": 100, "q": "Which condition develops over hours to days: AKI or CKD?", "a": "AKI.", "note": "AKI is a rapid decline in kidney function."}, {"value": 200, "q": "Which condition develops over months to years and is usually irreversible?", "a": "CKD.", "note": "CKD is characterized by progressive nephron loss."}, {"value": 300, "q": "What two diseases are the most common causes of CKD in the course material?", "a": "Diabetes and hypertension.", "note": "Both progressively damage renal structure and function."}, {"value": 400, "q": "Why can CKD lead to anemia?", "a": "Reduced erythropoietin production.", "note": "The diseased kidney produces less erythropoietin to stimulate red blood cell formation."}, {"value": 500, "q": "Why does progressive nephron loss accelerate CKD even when remaining nephrons initially compensate?", "a": "The remaining nephrons increase their workload and pressure, which eventually damages them too.", "note": "Compensatory hyperfunction can preserve filtration temporarily but contributes to further nephron injury over time."}]}, {"name": "GLOMERULAR CLUES", "questions": [{"value": 100, "q": "Nephrotic syndrome is primarily a protein-leaking or blood-leaking problem?", "a": "Protein-leaking.", "note": "The filtration membrane becomes excessively permeable to protein."}, {"value": 200, "q": "What major serum protein is lost in nephrotic syndrome?", "a": "Albumin.", "note": "Albumin loss contributes to hypoalbuminemia and edema."}, {"value": 300, "q": "What urine finding is especially associated with nephritic syndrome?", "a": "Hematuria.", "note": "Inflammation damages the glomerulus and allows red blood cells to enter the urine."}, {"value": 400, "q": "Why does edema develop in nephrotic syndrome?", "a": "Urinary albumin loss causes hypoalbuminemia, lowering plasma oncotic pressure.", "note": "Reduced oncotic pull allows fluid to move into the interstitial space."}, {"value": 500, "q": "Why can nephrotic syndrome cause hyperlipidemia?", "a": "The liver compensates for protein loss by increasing lipid production.", "note": "The hepatic response to hypoalbuminemia contributes to elevated circulating lipids."}]}, {"name": "UTI & STONES", "questions": [{"value": 100, "q": "What organism most commonly causes UTIs in this unit?", "a": "Escherichia coli (E. coli).", "note": "Most UTIs begin with ascending bacteria, commonly E. coli."}, {"value": 200, "q": "Dysuria, urgency, frequency, and suprapubic discomfort most strongly suggest infection at what level?", "a": "The bladder, or cystitis.", "note": "Lower urinary tract infection commonly produces these localized symptoms."}, {"value": 300, "q": "Fever, flank pain, nausea, vomiting, and CVA tenderness suggest what complication of an ascending UTI?", "a": "Pyelonephritis.", "note": "Once bacteria ascend to the kidney, systemic symptoms are more likely."}, {"value": 400, "q": "What is the most common kidney stone type in the course material?", "a": "Calcium oxalate.", "note": "Calcium oxalate stones account for the majority of stones discussed."}, {"value": 500, "q": "Why is a patient with both urinary obstruction and infection especially concerning?", "a": "Blocked infected urine can rapidly lead to sepsis and may require urgent intervention.", "note": "Impaired drainage allows infection and pressure to worsen simultaneously."}]}, {"name": "MALE REPRODUCTIVE RAPID FIRE", "questions": [{"value": 100, "q": "Painless scrotal enlargement caused by fluid around the testicle is called what?", "a": "Hydrocele.", "note": "Hydrocele is fluid accumulation surrounding the testicle."}, {"value": 200, "q": "A 'bag of worms' finding, usually on the left, describes what condition?", "a": "Varicocele.", "note": "Varicocele is dilation of the pampiniform venous plexus and may contribute to infertility."}, {"value": 300, "q": "A prolonged erection lasting more than four hours is called what?", "a": "Priapism.", "note": "Priapism is a urologic emergency because prolonged ischemia can cause permanent erectile dysfunction."}, {"value": 400, "q": "Fibrous plaque in the tunica albuginea causing penile curvature describes what disorder?", "a": "Peyronie disease.", "note": "Fibrous plaque formation creates curvature and discomfort."}, {"value": 500, "q": "What is the difference between phimosis and paraphimosis?", "a": "Phimosis means the foreskin cannot be retracted; paraphimosis means it is retracted but cannot be returned to normal position.", "note": "Paraphimosis threatens vascular compromise and requires urgent intervention."}]}];let scores=[0,0,0],current=null,used=new Set(),wronged=new Set();
function drawScores(){let s=document.getElementById('scores');s.innerHTML='';scores.forEach((v,i)=>{let d=document.createElement('div');d.className='team';d.innerHTML=`<input value="TEAM ${i+1}" aria-label="Team name"><div class="score">$${v}</div><div class="mini"><button onclick="adj(${i},100)">+100</button><button onclick="adj(${i},-100)">−100</button></div>`;s.appendChild(d)})}function adj(i,n){scores[i]+=n;drawScores()}
function drawBoard(){let b=document.getElementById('board');b.innerHTML='';DATA.forEach(c=>{let d=document.createElement('div');d.className='cat';d.textContent=c.name;b.appendChild(d)});for(let r=0;r<5;r++)DATA.forEach((c,ci)=>{let q=c.questions[r],k=ci+'-'+r,bt=document.createElement('button');bt.className='tile'+(used.has(k)?' used':'');bt.textContent=used.has(k)?'':('$'+q.value);bt.onclick=()=>openQ(ci,r);b.appendChild(bt)})}
function openQ(ci,r){let k=ci+'-'+r;if(used.has(k))return;current={ci,r,k,q:DATA[ci].questions[r]};wronged=new Set();document.getElementById('mvalue').textContent=DATA[ci].name+' • $'+current.q.value;document.getElementById('mq').textContent=current.q.q;document.getElementById('ma').textContent=current.q.a;document.getElementById('note').textContent=current.q.note;document.getElementById('ans').style.display='none';document.getElementById('grading').style.display='none';document.getElementById('reveal').style.display='inline-block';document.getElementById('modal').style.display='block'}
document.getElementById('reveal').onclick=()=>{document.getElementById('ans').style.display='block';document.getElementById('grading').style.display='block';document.getElementById('reveal').style.display='none';let g=document.getElementById('grading');g.innerHTML='';scores.forEach((_,i)=>{let d=document.createElement('div');d.className='teamRow';d.innerHTML=`<b>TEAM ${i+1}</b> <button class="btn correct" onclick="right(${i})">✓ CORRECT</button> <button class="btn wrong" onclick="wrong(${i})">✕ INCORRECT</button>`;g.appendChild(d)});let p=document.createElement('button');p.className='btn pass';p.textContent='NO ONE GOT IT / PASS';p.onclick=finish;g.appendChild(p)}
function right(i){scores[i]+=current.q.value;finish()}function wrong(i){if(!wronged.has(i)){scores[i]-=current.q.value;wronged.add(i);drawScores()}}function finish(){used.add(current.k);document.getElementById('modal').style.display='none';drawScores();drawBoard()}
document.getElementById('back').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('reset').onclick=()=>{scores=[0,0,0];used.clear();document.getElementById('wintext').textContent='';drawScores();drawBoard()};document.getElementById('winner').onclick=()=>{let m=Math.max(...scores),ix=scores.map((v,i)=>v===m?i+1:null).filter(Boolean);document.getElementById('wintext').textContent=ix.length===1?`🏆 TEAM ${ix[0]} WINS WITH $${m}!`:`🏆 TIE: TEAMS ${ix.join(' & ')} WITH $${m}!`};drawScores();drawBoard();</script></body></html>
