<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 5 Jeopardy</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06142f,#102b63);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:1450px;margin:auto;padding:16px}.title{text-align:center;color:#ffd54f;font-size:clamp(28px,4vw,52px);font-weight:950;text-shadow:0 3px #000}.sub{text-align:center;color:#9cecf3;font-size:18px;font-weight:800;margin:5px 0 14px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.team{background:#0b2148;border:2px solid #1f6ba7;border-radius:12px;padding:9px;text-align:center}.team input{width:100%;background:transparent;border:0;border-bottom:1px solid #ffffff55;color:white;text-align:center;font-weight:900;font-size:17px}.score{font-size:28px;color:#ffd54f;font-weight:950;margin:5px}.mini button{margin:2px;border:0;border-radius:7px;padding:6px 10px;font-weight:900;cursor:pointer}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.cat{background:#7136b6;padding:12px 5px;text-align:center;font-weight:950;min-height:66px;display:flex;align-items:center;justify-content:center;border-radius:6px}.tile{background:#087c96;color:#ffd54f;border:0;border-radius:6px;min-height:83px;font-size:30px;font-weight:950;cursor:pointer;text-shadow:0 2px #000}.tile.used{background:#182c45;color:#60748d;cursor:default}.actions{text-align:center;margin:12px}.actions button,.btn{border:0;border-radius:8px;padding:10px 14px;margin:3px;font-weight:900;cursor:pointer}.reset{background:#d81b60;color:white}.modal{display:none;position:fixed;inset:0;background:#020817ee;padding:18px;overflow:auto;z-index:10}.card{max-width:950px;margin:4vh auto;background:#0b2148;border:3px solid #ffd54f;border-radius:18px;padding:24px;text-align:center}.value{color:#ffd54f;font-size:25px;font-weight:950}.question{font-size:clamp(22px,3vw,34px);font-weight:900;line-height:1.3;margin:22px 0}.answer{display:none;background:white;color:#10203b;border-radius:12px;padding:17px;margin:15px 0;font-size:21px}.answer .teach{font-size:16px;margin-top:9px;line-height:1.4}.reveal{background:#ffd54f;color:#111}.correct{background:#2da45c;color:#fff}.wrong{background:#d93b50;color:#fff}.pass{background:#7b42d1;color:#fff}.back{background:#2496b5;color:#fff}.teamRow{margin:7px}.winner{font-size:24px;color:#ffd54f;font-weight:950}@media(max-width:800px){.board{grid-template-columns:repeat(5,minmax(110px,1fr));overflow:auto}.scores{grid-template-columns:1fr}.wrap{padding:7px}}
</style></head><body><div class="wrap"><div class="title">PATHOPHYSIOLOGY JEOPARDY!</div><div class="sub">Unit 5 • Musculoskeletal & Neuromuscular Disorders</div><div class="scores" id="scores"></div><div class="board" id="board"></div><div class="actions"><button class="btn reset" id="reset">RESET GAME</button><button class="btn back" id="winner">SHOW WINNER</button></div><div id="wintext" class="winner" style="text-align:center"></div></div>
<div class="modal" id="modal"><div class="card"><div id="mvalue" class="value"></div><div id="mq" class="question"></div><button id="reveal" class="btn reveal">REVEAL ANSWER</button><div id="ans" class="answer"><b id="ma"></b><div id="note" class="teach"></div></div><div id="grading" style="display:none"></div><button id="back" class="btn back">BACK TO BOARD</button></div></div>
<script>const DATA=[{"name": "JOINT WARS", "questions": [{"value": 100, "q": "What crystal is deposited in joints in gout?", "a": "Monosodium urate", "note": "Hyperuricemia promotes urate crystal deposition."}, {"value": 200, "q": "What inflammasome is activated in symptomatic gout?", "a": "NLRP3", "note": "Crystal phagocytosis activates NLRP3."}, {"value": 300, "q": "What cytokine is a key mediator of gout inflammation?", "a": "IL-1β", "note": "IL-1β drives intense neutrophilic inflammation."}, {"value": 400, "q": "What cytokine is primary in rheumatoid arthritis?", "a": "TNF-α", "note": "TNF-α is central to RA synovial inflammation."}, {"value": 500, "q": "What enzymes are upregulated in osteoarthritis cartilage degradation?", "a": "Matrix metalloproteinases (MMPs)", "note": "Mechanical stress promotes MMP-mediated cartilage breakdown."}]}, {"name": "BONE BUSINESS", "questions": [{"value": 100, "q": "What is the most common bone tumor in children/adolescents in this unit?", "a": "Osteosarcoma", "note": "Osteosarcoma is the emphasized pediatric bone tumor."}, {"value": 200, "q": "What organism commonly causes adult osteomyelitis?", "a": "Staphylococcus aureus", "note": "It is the primary pathogen listed."}, {"value": 300, "q": "What is a sequestrum?", "a": "Necrotic bone produced after infection-related ischemia", "note": "Pressure and vascular compression can deprive bone of blood flow."}, {"value": 400, "q": "What lab value is elevated in Paget disease?", "a": "Alkaline phosphatase (ALP)", "note": "Disordered bone remodeling raises ALP."}, {"value": 500, "q": "Describe Paget bone remodeling.", "a": "Excess osteoclastic resorption followed by disorganized osteoblastic repair", "note": "The result is abnormal bone architecture."}]}, {"name": "BUILD OR BREAK", "questions": [{"value": 100, "q": "Osteomalacia is primarily a defect of what?", "a": "Bone mineralization", "note": "Vitamin D deficiency can impair mineralization."}, {"value": 200, "q": "Osteoporosis reduces bone mass but preserves what?", "a": "Normal mineralization", "note": "The problem is quantity rather than mineral quality."}, {"value": 300, "q": "What hormone loss is strongly associated with postmenopausal osteoporosis?", "a": "Estrogen deficiency", "note": "Estrogen loss shifts remodeling toward resorption."}, {"value": 400, "q": "Name two ways glucocorticoids promote osteoporosis.", "a": "↓ osteoblast activity, ↑ osteoclast lifespan, ↓ calcium absorption, ↑ renal calcium excretion", "note": "Steroids disrupt both bone formation and calcium balance."}, {"value": 500, "q": "What happens first in fracture healing?", "a": "Hematoma formation", "note": "The hematoma is the immediate response to fracture."}]}, {"name": "MUSCLE EMERGENCY", "questions": [{"value": 100, "q": "What gene is associated with malignant hyperthermia?", "a": "RYR1", "note": "The mutation causes excessive calcium release."}, {"value": 200, "q": "Name one trigger of malignant hyperthermia.", "a": "Volatile anesthetics or succinylcholine", "note": "These agents can trigger excessive calcium release in susceptible patients."}, {"value": 300, "q": "Rhabdomyolysis releases what pigment protein?", "a": "Myoglobin", "note": "Myoglobin release contributes to kidney injury."}, {"value": 400, "q": "Name two complications of rhabdomyolysis.", "a": "Acute kidney injury, hyperkalemia, metabolic acidosis", "note": "Muscle breakdown releases intracellular contents."}, {"value": 500, "q": "What cells support muscle regeneration?", "a": "Satellite cells", "note": "They activate, proliferate, and fuse as myoblasts."}]}, {"name": "INJURY & SPINE", "questions": [{"value": 100, "q": "A strain injures what tissue?", "a": "Muscle or tendon", "note": "A sprain affects a ligament."}, {"value": 200, "q": "What defines a third-degree sprain?", "a": "Complete ligament rupture", "note": "Joint instability is a hallmark."}, {"value": 300, "q": "What is the key mechanism in compartment syndrome?", "a": "Increased compartment pressure impairs perfusion and causes ischemia", "note": "Pressure threatens tissue viability."}, {"value": 400, "q": "What is the initial degenerative change in degenerative disc disease?", "a": "Disc dehydration", "note": "Loss of water begins disc degeneration."}, {"value": 500, "q": "What structure is defective in spondylolysis?", "a": "Pars interarticularis", "note": "A pars defect distinguishes spondylolysis."}]}];let scores=[0,0,0],current=null,used=new Set(),wronged=new Set();
function drawScores(){let s=document.getElementById('scores');s.innerHTML='';scores.forEach((v,i)=>{let d=document.createElement('div');d.className='team';d.innerHTML=`<input value="TEAM ${i+1}" aria-label="Team name"><div class="score">$${v}</div><div class="mini"><button onclick="adj(${i},100)">+100</button><button onclick="adj(${i},-100)">−100</button></div>`;s.appendChild(d)})}function adj(i,n){scores[i]+=n;drawScores()}
function drawBoard(){let b=document.getElementById('board');b.innerHTML='';DATA.forEach(c=>{let d=document.createElement('div');d.className='cat';d.textContent=c.name;b.appendChild(d)});for(let r=0;r<5;r++)DATA.forEach((c,ci)=>{let q=c.questions[r],k=ci+'-'+r,bt=document.createElement('button');bt.className='tile'+(used.has(k)?' used':'');bt.textContent=used.has(k)?'':('$'+q.value);bt.onclick=()=>openQ(ci,r);b.appendChild(bt)})}
function openQ(ci,r){let k=ci+'-'+r;if(used.has(k))return;current={ci,r,k,q:DATA[ci].questions[r]};wronged=new Set();document.getElementById('mvalue').textContent=DATA[ci].name+' • $'+current.q.value;document.getElementById('mq').textContent=current.q.q;document.getElementById('ma').textContent=current.q.a;document.getElementById('note').textContent=current.q.note;document.getElementById('ans').style.display='none';document.getElementById('grading').style.display='none';document.getElementById('reveal').style.display='inline-block';document.getElementById('modal').style.display='block'}
document.getElementById('reveal').onclick=()=>{document.getElementById('ans').style.display='block';document.getElementById('grading').style.display='block';document.getElementById('reveal').style.display='none';let g=document.getElementById('grading');g.innerHTML='';scores.forEach((_,i)=>{let d=document.createElement('div');d.className='teamRow';d.innerHTML=`<b>TEAM ${i+1}</b> <button class="btn correct" onclick="right(${i})">✓ CORRECT</button> <button class="btn wrong" onclick="wrong(${i})">✕ INCORRECT</button>`;g.appendChild(d)});let p=document.createElement('button');p.className='btn pass';p.textContent='NO ONE GOT IT / PASS';p.onclick=finish;g.appendChild(p)}
function right(i){scores[i]+=current.q.value;finish()}function wrong(i){if(!wronged.has(i)){scores[i]-=current.q.value;wronged.add(i);drawScores()}}function finish(){used.add(current.k);document.getElementById('modal').style.display='none';drawScores();drawBoard()}
document.getElementById('back').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('reset').onclick=()=>{scores=[0,0,0];used.clear();document.getElementById('wintext').textContent='';drawScores();drawBoard()};document.getElementById('winner').onclick=()=>{let m=Math.max(...scores),ix=scores.map((v,i)=>v===m?i+1:null).filter(Boolean);document.getElementById('wintext').textContent=ix.length===1?`🏆 TEAM ${ix[0]} WINS WITH $${m}!`:`🏆 TIE: TEAMS ${ix.join(' & ')} WITH $${m}!`};drawScores();drawBoard();</script></body></html>
