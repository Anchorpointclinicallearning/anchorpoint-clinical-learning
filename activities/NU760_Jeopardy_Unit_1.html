<script>
const WEEKS={"1": {"title": "Unit 1 • Scholarship in Nursing Practice", "cats": [{"name": "SCHOLARSHIP 101", "questions": [{"value": 100, "q": "Nursing scholarship is broader than publishing what type of work?", "a": "Research", "note": "NU760 frames scholarship as systematic inquiry, integration, application, teaching, and dissemination, not publication alone."}, {"value": 200, "q": "What makes clinical scholarship meaningful in practice?", "a": "Connecting knowledge with real practice", "note": "Scholarship becomes useful when knowledge is examined, connected, applied, evaluated, and shared."}, {"value": 300, "q": "What two habits help turn everyday professional work into scholarship?", "a": "Systematic inquiry and evaluation", "note": "The course emphasizes making practice work systematic, evidence-informed, evaluative, and visible."}, {"value": 400, "q": "Clinical scholarship can influence care, education, leadership, policy, and what other broad area?", "a": "Science", "note": "Scholarship can affect science as well as clinical care, education, leadership, and policy."}, {"value": 500, "q": "What feature helps distinguish scholarship from simply having a good idea?", "a": "Systematic evaluation and dissemination", "note": "Scholarship requires a systematic approach and sharing what is learned so others can benefit."}]}, {"name": "BOYER'S FOUR", "questions": [{"value": 100, "q": "Which Boyer domain focuses on generating new knowledge?", "a": "Discovery", "note": "Discovery is the domain most closely associated with traditional research."}, {"value": 200, "q": "Which Boyer domain connects knowledge across disciplines or contexts?", "a": "Integration", "note": "Integration makes connections among ideas, disciplines, or settings."}, {"value": 300, "q": "Which Boyer domain uses knowledge to address real-world problems?", "a": "Application", "note": "Application puts knowledge to work in practice or society."}, {"value": 400, "q": "Which Boyer domain treats the systematic advancement of learning as scholarship?", "a": "Teaching", "note": "Teaching scholarship includes deliberate design, evaluation, and sharing of learning."}, {"value": 500, "q": "A nurse educator redesigns orientation, evaluates learning outcomes, and shares the results. Which Boyer domain is most strongly represented?", "a": "Teaching", "note": "The key clue is the systematic development and evaluation of learning."}]}, {"name": "RESEARCH • EBP • QI", "questions": [{"value": 100, "q": "Which approach is primarily designed to generate or test knowledge?", "a": "Research", "note": "Research seeks to generate or test knowledge."}, {"value": 200, "q": "Which approach integrates best evidence, clinical expertise, and patient values?", "a": "Evidence-based practice (EBP)", "note": "EBP brings evidence together with expertise and patient preferences or values."}, {"value": 300, "q": "Which approach aims to improve a local process or outcome?", "a": "Quality improvement (QI)", "note": "QI focuses on improving a process or outcome in a specific setting."}, {"value": 400, "q": "True or false: Research, EBP, and QI are interchangeable terms.", "a": "False", "note": "They can overlap and all can contribute to scholarship, but their purposes are not identical."}, {"value": 500, "q": "Why does the distinction among research, EBP, and QI matter later in the course?", "a": "It affects methods, ethics, evidence use, and project planning", "note": "The purpose of the work shapes how it is designed and overseen."}]}, {"name": "READ THE ARTICLE", "questions": [{"value": 100, "q": "Which section gives a rapid overview of background, methods, results, and conclusions?", "a": "Abstract", "note": "The abstract helps determine whether an article may be relevant."}, {"value": 200, "q": "Where should you look for study design, participants, recruitment, and data collection?", "a": "Methods", "note": "Methods contains the details needed to understand how the study was conducted."}, {"value": 300, "q": "In which section is the problem, knowledge gap, purpose, aim, or research question usually introduced?", "a": "Background or Introduction", "note": "Authors may use different headings, but this information usually appears early in the article."}, {"value": 400, "q": "Qualitative findings are often presented as what rather than p-values?", "a": "Themes, categories, or patterns", "note": "Results look different depending on the study design."}, {"value": 500, "q": "Why is the abstract alone insufficient for critical appraisal?", "a": "The methodological details needed to judge rigor are in the full article", "note": "Appraisal requires details that abstracts usually cannot provide."}]}, {"name": "SCHOLARLY HABITS", "questions": [{"value": 100, "q": "What should students read before starting an assignment: only the prompt, or the prompt plus what?", "a": "The rubric", "note": "The rubric is the grading blueprint."}, {"value": 200, "q": "What should be uploaded when an assignment requires retrievable evidence?", "a": "The full-text PDFs", "note": "Accessible evidence supports academic transparency and verification."}, {"value": 300, "q": "In live class, conversation can be casual. How should submitted work be written?", "a": "Scholarly and professional", "note": "The course distinguishes conversational learning from graduate-level written scholarship."}, {"value": 400, "q": "What should your writing make visible instead of forcing the reader to infer it?", "a": "Your scholarly reasoning", "note": "Strong work explains why evidence, frameworks, and decisions fit the project."}, {"value": 500, "q": "What is one of the best ways to prevent losing points for a missing assignment element?", "a": "Cross-check the completed work against the instructions and rubric before submission", "note": "A final rubric check catches omissions before grading."}]}]}, "2": {"title": "Unit 2 • Gap Analysis and Problem Statement", "cats": [{"name": "DESIGN THINKING", "questions": [{"value": 100, "q": "What is the first design-thinking step in the sequence used in Unit 2?", "a": "Empathize", "note": "Start by understanding the experiences and needs of the people affected."}, {"value": 200, "q": "After empathizing, which step clarifies the real problem?", "a": "Define", "note": "Define turns observations into a clearer problem statement."}, {"value": 300, "q": "What comes after Define in the design-thinking sequence?", "a": "Ideate", "note": "Ideate generates possible approaches before choosing one."}, {"value": 400, "q": "Why is buying a new app immediately after noticing inconsistent discharge teaching a design-thinking mistake?", "a": "It jumps to a solution before understanding the problem", "note": "Unit 2 emphasizes problem understanding before intervention selection."}, {"value": 500, "q": "True or false: Innovation must involve new technology.", "a": "False", "note": "A workflow, checklist, communication process, or teaching strategy can also be innovative."}]}, {"name": "FIND THE GAP", "questions": [{"value": 100, "q": "What is a practice gap?", "a": "The measurable difference between current practice and evidence-informed best practice", "note": "A gap has a current-state side and an expected-practice side."}, {"value": 200, "q": "What are the two sides of a practice gap?", "a": "Current practice and best practice", "note": "You need evidence for what is happening now and what should be happening."}, {"value": 300, "q": "Why is 'Discharge teaching seems inconsistent' not yet a complete gap statement?", "a": "It is an observation, not a measured comparison", "note": "The gap needs evidence showing the difference between current and expected practice."}, {"value": 400, "q": "What makes a practice gap visible rather than anecdotal?", "a": "Data", "note": "Local data, audits, quality indicators, surveys, or other measures help demonstrate the gap."}, {"value": 500, "q": "Before defining a gap, what should evidence establish about best practice?", "a": "What should be happening", "note": "The expected standard must be supported, not assumed."}]}, {"name": "ROOT CAUSE REALITY", "questions": [{"value": 100, "q": "A contributing factor does what?", "a": "Helps create or sustain the problem", "note": "A contributing factor may matter without being the deepest underlying cause."}, {"value": 200, "q": "A root cause is best described as what?", "a": "An underlying systems-level reason the problem persists", "note": "Root-cause analysis looks beneath the surface behavior."}, {"value": 300, "q": "Why is 'nurses are noncompliant' a weak systems analysis?", "a": "It blames individuals instead of examining the system", "note": "Unit 2 asks students to look at workflow, resources, policy, communication, and context."}, {"value": 400, "q": "Which is stronger: 'Why won't nurses ambulate patients?' or 'What conditions make timely ambulation difficult?'", "a": "What conditions make timely ambulation difficult?", "note": "The second question opens the door to systems-level causes."}, {"value": 500, "q": "What characteristic makes a root cause useful for project planning?", "a": "It is actionable and meaningfully connected to the gap", "note": "Priority causes should be important, supported, and potentially modifiable."}]}, {"name": "PROBLEM STATEMENTS", "questions": [{"value": 100, "q": "A problem statement should describe the problem, not your favorite what?", "a": "Solution", "note": "Intervention selection comes later."}, {"value": 200, "q": "What should a strong problem statement identify about the setting?", "a": "Where the problem occurs", "note": "Context helps make the problem specific and actionable."}, {"value": 300, "q": "What should support the significance of a problem statement?", "a": "Data and evidence", "note": "The statement should grow from the documented gap."}, {"value": 400, "q": "Why should the problem statement avoid intervention language?", "a": "Because it should establish what is wrong before deciding how to fix it", "note": "Premature solution language narrows inquiry too early."}, {"value": 500, "q": "What should the problem statement logically grow from?", "a": "The gap analysis and supporting evidence", "note": "It is the concise conclusion of the earlier analysis."}]}, {"name": "PRIORITIZE & PROVE", "questions": [{"value": 100, "q": "What should evidence help establish first: the solution or the existence and significance of the gap?", "a": "The existence and significance of the gap", "note": "Unit 2 is still focused on defining the practice problem."}, {"value": 200, "q": "Why does the 'big picture' matter in gap analysis?", "a": "The problem is shaped by people, workflow, systems, and context", "note": "A narrow individual explanation can miss important contributors."}, {"value": 300, "q": "What should happen before selecting a priority root cause?", "a": "Analyze multiple contributing factors", "note": "Prioritization should follow analysis, not guesswork."}, {"value": 400, "q": "What famous nursing example illustrates making a problem visible with data before designing the response?", "a": "Florence Nightingale", "note": "The lesson is to let data clarify the problem before jumping to the solution."}, {"value": 500, "q": "What is the key Unit 2 sequence?", "a": "Observation → gap → contributing factors/root cause → problem statement", "note": "Each step narrows and strengthens the practice problem."}]}]}, "3": {"title": "Unit 3 • Aim Statement and Framework", "cats": [{"name": "AIM ANATOMY", "questions": [{"value": 100, "q": "An aim statement describes what type of change?", "a": "A focused improvement the project intends to achieve", "note": "It gives the project a measurable direction."}, {"value": 200, "q": "An aim should center on how many selected interventions?", "a": "One", "note": "Unit 3 warns against turning the aim into a shopping list."}, {"value": 300, "q": "What should an aim identify about the target group or location?", "a": "The population and/or practice setting", "note": "The aim must say who or where the change applies."}, {"value": 400, "q": "What should an aim include about the desired result?", "a": "A clear outcome", "note": "The reader should know what is expected to improve."}, {"value": 500, "q": "What timing element strengthens an aim statement?", "a": "A time frame or evaluation date", "note": "A strong aim states when the improvement will be assessed."}]}, {"name": "WHAT'S MISSING?", "questions": [{"value": 100, "q": "'Improve fall prevention' is a topic or an aim statement?", "a": "A topic", "note": "It lacks the specific intervention, population, outcome, and time frame."}, {"value": 200, "q": "'Implement structured discharge education for adults with heart failure' is missing what major element?", "a": "The desired measurable outcome and time frame", "note": "It says what and who, but not what should improve or by when."}, {"value": 300, "q": "What question does the aim answer after the problem is defined?", "a": "Where is the project going?", "note": "The problem identifies the need; the aim defines the intended improvement."}, {"value": 400, "q": "Why should the aim connect directly to the problem statement?", "a": "The intervention and outcome must address the documented practice gap", "note": "A disconnected aim weakens project logic."}, {"value": 500, "q": "What should you avoid listing in a single aim?", "a": "Multiple interventions", "note": "The course directs students to select one primary strategy."}]}, {"name": "FRAMEWORK FIT", "questions": [{"value": 100, "q": "What does a framework provide for the project?", "a": "A lens for understanding the problem", "note": "It helps organize thinking about factors related to the problem."}, {"value": 200, "q": "Should you start with your favorite framework or with the problem?", "a": "The problem", "note": "Framework selection should be driven by fit."}, {"value": 300, "q": "What kind of framework is intended to explain relationships or contributing factors?", "a": "An explanatory framework", "note": "It helps explain why a problem may occur or persist."}, {"value": 400, "q": "What kind of framework is grounded in a formal theory?", "a": "A theoretical framework", "note": "A theoretical framework draws on an established theory."}, {"value": 500, "q": "What must you do beyond simply naming and defining the framework?", "a": "Explain why it fits and how it guides the project", "note": "The assignment expects application, not a dictionary definition."}]}, {"name": "NOT THE SAME THING", "questions": [{"value": 100, "q": "Is PDSA an explanatory/theoretical framework for the Unit 3 requirement?", "a": "No", "note": "PDSA is an improvement method or implementation approach, not the type of framework required here."}, {"value": 200, "q": "Why is a QI model not automatically the same as a conceptual framework?", "a": "They serve different purposes", "note": "A framework helps explain the problem; a QI model guides how change is implemented."}, {"value": 300, "q": "What common Unit 3 error occurs when students choose a framework because they plan to test a workflow?", "a": "They select an implementation model instead of an explanatory or theoretical framework", "note": "The assignment specifically asks for the latter."}, {"value": 400, "q": "Can AI suggest possible framework names?", "a": "Yes, as a starting point", "note": "Students still must verify the framework in credible sources and judge fit."}, {"value": 500, "q": "What is the final test of a framework choice?", "a": "Whether it meaningfully fits the identified problem and can guide the analysis", "note": "Popularity alone is not enough."}]}, {"name": "EVIDENCE WITH PURPOSE", "questions": [{"value": 100, "q": "What should Unit 3 evidence support about the problem?", "a": "Its significance and the rationale for the project", "note": "Evidence should strengthen the case that the problem matters."}, {"value": 200, "q": "Should the framework itself be supported by scholarly evidence?", "a": "Yes", "note": "The framework section should use credible sources to explain and justify the selection."}, {"value": 300, "q": "What prior unit work should be brought forward rather than recreated from scratch?", "a": "The Unit 2 practice problem and gap analysis", "note": "Unit 3 builds on the prior assignment."}, {"value": 400, "q": "What are you NOT writing yet in Unit 3?", "a": "The full implementation plan", "note": "The focus is the problem, aim, and framework."}, {"value": 500, "q": "Complete the sequence: Problem → Aim → _____.", "a": "Framework", "note": "That is the conceptual progression emphasized in the module."}]}]}, "4": {"title": "Unit 4 • Evidence Matrix and Critical Appraisal", "cats": [{"name": "MATRIX MOVES", "questions": [{"value": 100, "q": "What is the main purpose of an evidence matrix?", "a": "To organize literature so similarities, differences, and contributions are visible", "note": "The matrix supports synthesis, not just storage."}, {"value": 200, "q": "What should be placed at the top of the matrix to keep the search anchored?", "a": "The Unit 2 problem statement", "note": "It keeps evidence selection tied to the identified practice problem."}, {"value": 300, "q": "What citation format belongs in the matrix row identifying a source?", "a": "The in-text citation", "note": "The full APA reference belongs below the table or in the reference section."}, {"value": 400, "q": "What should the 'purpose' column capture?", "a": "What the study, review, guideline, or report was trying to determine", "note": "Keep it accurate and concise."}, {"value": 500, "q": "What should the support column make explicit?", "a": "How the source supports or does not support the proposed project/intervention", "note": "Do not make the reader infer the connection."}]}, {"name": "EVIDENCE TYPE", "questions": [{"value": 100, "q": "A systematic review is research evidence or non-research evidence?", "a": "It depends on the course classification, but it is an evidence synthesis that must be correctly identified by type", "note": "The key Unit 4 skill is accurately identifying the source design or literature type before appraisal."}, {"value": 200, "q": "What should you identify for a research article?", "a": "The study design", "note": "Design determines which appraisal criteria apply."}, {"value": 300, "q": "What should you identify for non-research evidence?", "a": "The literature or evidence type", "note": "Examples include guidelines, reports, or other evidence syntheses."}, {"value": 400, "q": "Why should you not guess evidence type from the article title?", "a": "Titles may not reveal the actual methodology", "note": "Check the methods and article structure."}, {"value": 500, "q": "A paper searches multiple databases, uses explicit inclusion criteria, and synthesizes included studies. What broad type is it?", "a": "A systematic review", "note": "Those are hallmark features of a systematic review process."}]}, {"name": "JBI MATCH GAME", "questions": [{"value": 100, "q": "What must you identify before choosing a JBI critical appraisal tool?", "a": "The study or source design", "note": "Tool selection depends on design."}, {"value": 200, "q": "Which JBI tool should be used for a systematic review and meta-analysis?", "a": "The JBI checklist for systematic reviews and research syntheses", "note": "Match the tool to the source design."}, {"value": 300, "q": "Why is using the wrong JBI checklist a serious problem?", "a": "The questions may not assess the methodological features of that design", "note": "Appraisal becomes invalid or misleading."}, {"value": 400, "q": "Where should you go when unsure which JBI tool matches your article?", "a": "The JBI Critical Appraisal Tools guidance/page", "note": "Do not improvise the tool choice."}, {"value": 500, "q": "True or false: One JBI checklist works for every study design.", "a": "False", "note": "Different designs require different appraisal criteria."}]}, {"name": "APPRAISE, DON'T CHECK", "questions": [{"value": 100, "q": "What does a JBI 'Yes' answer mean?", "a": "The criterion is clearly met", "note": "It should be supported by evidence from the article."}, {"value": 200, "q": "What does 'Unclear' mean during appraisal?", "a": "There is not enough information to determine whether the criterion is met", "note": "Unclear is different from No."}, {"value": 300, "q": "Why is 'Yes, the search strategy was appropriate' a weak appraisal response?", "a": "It gives a conclusion without evidence from the article", "note": "Strong appraisal points to the methods or details supporting the judgment."}, {"value": 400, "q": "Does one 'No' automatically mean the article must be excluded?", "a": "No", "note": "The importance of the unmet criterion and the overall rigor must be considered."}, {"value": 500, "q": "What is critical appraisal trying to determine beyond relevance?", "a": "How much confidence you can place in the evidence", "note": "Relevant evidence may still be methodologically weak."}]}, {"name": "INCLUDE OR EXCLUDE?", "questions": [{"value": 100, "q": "What should an inclusion/exclusion decision be based on?", "a": "The appraisal of rigor, validity, relevance, and fit with the project", "note": "The decision should be reasoned, not arbitrary."}, {"value": 200, "q": "What can happen if appraisal reveals weak evidence for the intervention?", "a": "You may need to return to the literature search", "note": "Appraisal can expose gaps in the evidence base."}, {"value": 300, "q": "Why is an evidence matrix not just three article summaries?", "a": "It should enable comparison and synthesis across sources", "note": "The goal is the collective evidence picture."}, {"value": 400, "q": "What should all cited project-supporting articles be when required by the course?", "a": "Retrievable as full-text PDFs", "note": "This supports transparency and verification."}, {"value": 500, "q": "Complete the Unit 4 logic: Organize the evidence → appraise it → _____ it.", "a": "Synthesize", "note": "The goal is to decide what the body of evidence collectively supports."}]}]}, "5": {"title": "Unit 5 • Strategy and Evaluation", "cats": [{"name": "DONABEDIAN", "questions": [{"value": 100, "q": "In Donabedian's model, what does Structure represent?", "a": "The setting, resources, people, systems, and capacity", "note": "Structure is what is in place."}, {"value": 200, "q": "In Donabedian's model, what does Process represent?", "a": "The care or activity delivered", "note": "Process is what people do."}, {"value": 300, "q": "In Donabedian's model, what does Outcome represent?", "a": "The result that follows from the structure and process", "note": "Outcome is what changed."}, {"value": 400, "q": "In a heart-failure education project, nurses, education materials, and EHR documentation are what component?", "a": "Structure", "note": "They are resources and system elements needed for the intervention."}, {"value": 500, "q": "In that same project, delivering the structured discharge education as planned is what component?", "a": "Process", "note": "It is the activity being carried out."}]}, {"name": "MEASURE THIS", "questions": [{"value": 100, "q": "An outcome is the change you hope to achieve. What is an evaluative measure?", "a": "The specific indicator used to determine whether the change occurred", "note": "The measure operationalizes the outcome."}, {"value": 200, "q": "What is a data-collection approach?", "a": "How and where the information will be obtained", "note": "It is distinct from the outcome and the measure."}, {"value": 300, "q": "Why is 'We will evaluate whether education worked' weak evaluation language?", "a": "It does not specify what will be measured or how", "note": "Strong evaluation language identifies the indicator, data, source, and timing."}, {"value": 400, "q": "Why should two evaluative measures add different information?", "a": "Together they give a fuller picture of whether the intervention worked", "note": "Redundant measures add little value."}, {"value": 500, "q": "What four questions should a strong evaluative measure answer?", "a": "What is measured, how it is defined, where the data come from, and when/how often it is measured", "note": "Specificity makes the evaluation defensible."}]}, {"name": "DATA SOURCES", "questions": [{"value": 100, "q": "Readmission rates and lab values are commonly obtained from what source?", "a": "EHR/EMR or organizational data systems", "note": "Existing clinical data can support outcome measurement."}, {"value": 200, "q": "Patient experience, symptoms, or knowledge may be measured using what source?", "a": "A patient survey or validated instrument", "note": "Patient-reported data may capture outcomes not visible in the EHR."}, {"value": 300, "q": "Why does the rubric require more than simply naming two measures?", "a": "Students must also identify the data needed and how it will be collected", "note": "Measurement is incomplete without a collection plan."}, {"value": 400, "q": "What should determine the choice of data source?", "a": "The evaluative measure and the information needed to calculate or interpret it", "note": "Start with the question the measure must answer."}, {"value": 500, "q": "What is a key warning when choosing an easy-to-obtain metric?", "a": "Convenience does not make it meaningful", "note": "Measures should reflect the aim and a meaningful change."}]}, {"name": "CHOOSE ONE", "questions": [{"value": 100, "q": "Before selecting an intervention, what should you summarize from the literature?", "a": "The reasonable evidence-supported strategies or options", "note": "Show the range before selecting the best fit."}, {"value": 200, "q": "How many interventions should be selected for the Unit 5 project plan?", "a": "One", "note": "The assignment asks students to choose one best-fit strategy."}, {"value": 300, "q": "What should justify selecting that one intervention?", "a": "Its fit with the problem, evidence, setting, and desired outcome", "note": "Selection should be reasoned and evidence-based."}, {"value": 400, "q": "Who should be identified after selecting the intervention?", "a": "The people or groups needed to operationalize it", "note": "Implementation depends on who must carry out or support the change."}, {"value": 500, "q": "What prior work should be revised and brought into Unit 5?", "a": "The problem statement and aim statement", "note": "Unit 5 builds from Units 2 through 4 rather than starting over."}]}, {"name": "EVALUATION ALIGNMENT", "questions": [{"value": 100, "q": "What should every evaluative measure align with?", "a": "The aim statement and desired outcome", "note": "If the aim changes, the measures may need to change too."}, {"value": 200, "q": "What is one example of a patient-centered outcome in the heart-failure exemplar?", "a": "Patient heart-failure knowledge", "note": "It reflects a meaningful change for the patient."}, {"value": 300, "q": "What is one system-level outcome used in the exemplar?", "a": "30-day all-cause readmission rate", "note": "It captures a utilization outcome relevant to the intervention."}, {"value": 400, "q": "What should evidence continue to support in Unit 5?", "a": "The selected intervention and evaluation logic", "note": "Evidence must follow the project into the strategy and evaluation plan."}, {"value": 500, "q": "Complete the Unit 5 sequence: evidence → intervention → outcome → measure → _____.", "a": "Data collection", "note": "That sequence turns an evidence-based idea into an evaluable project."}]}]}, "6": {"title": "Unit 6 • Ethical Conduct of Scholarly Activities", "cats": [{"name": "BELMONT BASICS", "questions": [{"value": 100, "q": "Name the three Belmont principles.", "a": "Respect for persons, beneficence, and justice", "note": "These principles anchor human-participant protections."}, {"value": 200, "q": "Which principle emphasizes autonomy and voluntary participation?", "a": "Respect for persons", "note": "It also calls for added protection for people with diminished autonomy."}, {"value": 300, "q": "Which principle focuses on minimizing harm and weighing risks and benefits?", "a": "Beneficence", "note": "Use the least risky approach that can answer the project question."}, {"value": 400, "q": "Which principle focuses on fair participant selection and distribution of burdens and benefits?", "a": "Justice", "note": "Convenience alone should not determine who bears the burden."}, {"value": 500, "q": "A patient feels pressured to participate because the project leader is involved in their care. Which principle is most directly threatened?", "a": "Respect for persons", "note": "Potential pressure can undermine voluntariness."}]}, {"name": "PRIVACY & DATA", "questions": [{"value": 100, "q": "Privacy refers to control over access to what?", "a": "The person or personal information", "note": "Privacy concerns whether and how access occurs."}, {"value": 200, "q": "Confidentiality refers to what?", "a": "How information that has been shared is protected from inappropriate disclosure", "note": "It is about handling information after access is granted."}, {"value": 300, "q": "What data principle says to collect only what the project needs?", "a": "Use the minimum necessary data", "note": "Collecting extra identifiable information increases risk without benefit."}, {"value": 400, "q": "Who should have access to identifiable project data?", "a": "Only authorized individuals who need it for the approved work", "note": "Access should be limited and justified."}, {"value": 500, "q": "Why do ethical duties continue after data collection?", "a": "Analysis, storage, reporting, and dissemination can still create risk or misrepresentation", "note": "Ethics applies across the entire project life cycle."}]}, {"name": "RESEARCH INTEGRITY", "questions": [{"value": 100, "q": "Making up data is called what?", "a": "Fabrication", "note": "Fabrication is creating results or data that never existed."}, {"value": 200, "q": "Changing or manipulating data dishonestly is called what?", "a": "Falsification", "note": "Falsification distorts the scholarly record."}, {"value": 300, "q": "Presenting someone else's work as your own is what ethical violation?", "a": "Plagiarism or misrepresentation of authorship", "note": "Scholarly integrity includes giving proper credit."}, {"value": 400, "q": "Why is selectively reporting only favorable findings an integrity problem?", "a": "It misrepresents the evidence", "note": "Accurate reporting includes inconvenient or unexpected results."}, {"value": 500, "q": "What should scholars recognize and manage rather than pretend does not exist?", "a": "Bias and conflicts of interest", "note": "Transparency helps protect the credibility of the work."}]}, {"name": "IRB RULES", "questions": [{"value": 100, "q": "What does IRB stand for?", "a": "Institutional Review Board", "note": "The IRB provides oversight for applicable human-participant activities."}, {"value": 200, "q": "When must required IRB review or approval occur?", "a": "Before implementation begins", "note": "Approval cannot be obtained retroactively to legitimize already-started activity."}, {"value": 300, "q": "What is one core function of an IRB?", "a": "Review participant protections, risk, consent, privacy, and data safeguards when applicable", "note": "Oversight focuses on ethical conduct and protection."}, {"value": 400, "q": "Should students decide on their own that a project does not need IRB review and begin collecting data?", "a": "No", "note": "Institutional processes determine whether review, exemption, or another determination is required."}, {"value": 500, "q": "What is the student's responsibility when preparing IRB materials?", "a": "Describe the project accurately and completely", "note": "The review depends on an honest description of what will occur."}]}, {"name": "CITI & ETHICS", "questions": [{"value": 100, "q": "What is the major Unit 6 assignment?", "a": "CITI certification", "note": "The training is meant to build understanding of human-participant protections and research ethics."}, {"value": 200, "q": "Does ethical responsibility apply only to traditional research?", "a": "No", "note": "QI and scholarship of application still involve privacy, fairness, risk, data integrity, and institutional oversight."}, {"value": 300, "q": "What does CITI primarily teach in this unit?", "a": "Human-participant protections and research ethics principles", "note": "The course connects those principles to graduate scholarship."}, {"value": 400, "q": "When do ethical considerations begin in a scholarly project?", "a": "At project inception or design", "note": "Ethics is not an add-on at the end."}, {"value": 500, "q": "Complete the Unit 6 message: Ethics begins when the project _____.", "a": "Begins", "note": "Ethical responsibility continues through implementation, analysis, and dissemination."}]}]}, "7": {"title": "Unit 7 • Scholarship to Inform Practice and Readiness", "cats": [{"name": "READY OR NOT?", "questions": [{"value": 100, "q": "What question becomes central in Unit 7?", "a": "Is the setting prepared to implement and sustain the change?", "note": "A strong intervention can still fail in an unready environment."}, {"value": 200, "q": "What two types of information must QI combine?", "a": "Evidence and local context", "note": "Evidence shows what should change; context shows whether the change can work here."}, {"value": 300, "q": "Is readiness simply a yes/no judgment?", "a": "No", "note": "Readiness can be strong in one area and weak in another."}, {"value": 400, "q": "What is an enabler?", "a": "A factor that increases the likelihood that change can be implemented", "note": "Enablers support adoption and sustainability."}, {"value": 500, "q": "What is a barrier?", "a": "A factor that may hinder or derail implementation", "note": "Barriers may require preparation or mitigation before launch."}]}, {"name": "EMPLOYEE READINESS", "questions": [{"value": 100, "q": "Employee readiness asks whether the people doing the work are what two things?", "a": "Prepared and willing", "note": "Understanding, confidence, workload, and perceived value all matter."}, {"value": 200, "q": "Staff understand the change but worry they lack time to learn a new workflow. Which readiness lens is this?", "a": "Employee readiness", "note": "The concern centers on the people expected to perform the work."}, {"value": 300, "q": "Why is 'the nurses will be supportive' not an adequate readiness assessment?", "a": "It is an assumption without evidence", "note": "Readiness claims should be grounded in local observations, data, or evidence."}, {"value": 400, "q": "Name one factor that may strengthen employee readiness.", "a": "Understanding, confidence, perceived benefit, skills, training, or protected time", "note": "Any of these can support willingness and capability."}, {"value": 500, "q": "What should an employee readiness analysis connect to the intervention?", "a": "How staff factors may help or hinder implementation", "note": "Identification alone is not enough; explain the effect."}]}, {"name": "STAKEHOLDER MAP", "questions": [{"value": 100, "q": "Who is a stakeholder?", "a": "Anyone who implements, influences, is affected by, or has authority over the change", "note": "Stakeholders extend beyond the frontline staff."}, {"value": 200, "q": "What two dimensions are used in the stakeholder map discussed in Unit 7?", "a": "Power and interest", "note": "These dimensions help guide engagement strategies."}, {"value": 300, "q": "Why is stakeholder identification not the same as stakeholder readiness?", "a": "Identification says who matters; readiness evaluates influence, interest, support, and engagement", "note": "The assignment asks for analysis, not just a list of names."}, {"value": 400, "q": "What four questions guide stakeholder readiness?", "a": "Who has influence, who is affected, who can help, and who may resist or block the change", "note": "These questions clarify engagement needs."}, {"value": 500, "q": "A high-power stakeholder with low support poses what implementation concern?", "a": "A potentially important barrier or engagement priority", "note": "Power can magnify either support or resistance."}]}, {"name": "ORGANIZATION CHECK", "questions": [{"value": 100, "q": "Organizational readiness includes culture, leadership, resources, systems, and what other broad concept?", "a": "Capacity", "note": "The organization must have the ability to support the change."}, {"value": 200, "q": "Visible leadership support is generally an enabler or barrier?", "a": "Enabler", "note": "Leadership support can provide priority, authority, and resources."}, {"value": 300, "q": "Competing initiatives and change fatigue are generally enablers or barriers?", "a": "Barriers", "note": "They can reduce attention, energy, and capacity for another change."}, {"value": 400, "q": "Protected education time is generally an enabler or barrier?", "a": "Enabler", "note": "It creates capacity for staff preparation."}, {"value": 500, "q": "Why can strong evidence still fail to produce successful implementation?", "a": "The local organization may lack support, resources, workflow fit, or capacity", "note": "Evidence alone does not guarantee implementation success."}]}, {"name": "CONNECT THE DOTS", "questions": [{"value": 100, "q": "What three readiness lenses must the Unit 7 assignment address?", "a": "Employee, stakeholder, and organizational readiness", "note": "Each lens captures a different part of implementation context."}, {"value": 200, "q": "What should a strong readiness assessment connect with local observations?", "a": "Scholarly evidence", "note": "The analysis should synthesize evidence with the actual practice context."}, {"value": 300, "q": "What should students bring forward from earlier work into Unit 7?", "a": "The practice setting and revised aim statement", "note": "Readiness is assessed for the same proposed change."}, {"value": 400, "q": "What is the difference between identifying a barrier and analyzing it?", "a": "Analysis explains how the barrier could affect implementation and what it means for readiness", "note": "A list alone does not demonstrate doctoral-level reasoning."}, {"value": 500, "q": "Complete the course logic through Unit 7: problem → aim/framework → evidence/appraisal → strategy/evaluation → ethics → _____.", "a": "Readiness for implementation", "note": "Unit 7 tests whether the environment can support the evidence-based change."}]}]}};

let activeWeek=1;
let DATA=WEEKS[activeWeek].cats;
let scores=[0,0,0],used=new Set(),current=null;

const board=document.getElementById('board'),modal=document.getElementById('modal');
const weekTitle=document.getElementById('weekTitle');

function money(n){return (n<0?'-$':'$')+Math.abs(n)}
function update(){
  scores.forEach((x,i)=>document.getElementById('s'+i).textContent=money(x));
  document.getElementById('status').textContent=(25-used.size)+' questions remaining';
}
function resetTeamButtons(){
  document.querySelectorAll('[data-wrong]').forEach(b=>{b.disabled=false;b.textContent='✕ Incorrect'});
}
function draw(){
 board.innerHTML='';
 weekTitle.textContent=WEEKS[activeWeek].title;
 DATA.forEach((c,i)=>{let d=document.createElement('div');d.className='cat c'+i;d.textContent=c.name;board.appendChild(d)});
 for(let r=0;r<5;r++) DATA.forEach((c,ci)=>{
   let k=ci+'-'+r,b=document.createElement('button');
   b.className='tile c'+ci;b.textContent=used.has(k)?'✓':'$'+c.questions[r].value;
   b.disabled=used.has(k);b.onclick=()=>openQ(ci,r);board.appendChild(b)
 });
 update();
 let w=document.getElementById('winner');
 if(used.size===25){
   let max=Math.max(...scores),wins=scores.map((s,i)=>s===max?'Team '+(i+1):null).filter(Boolean);
   w.style.display='block';
   w.textContent='🏆 '+wins.join(' & ')+' '+(wins.length>1?'tie':'wins')+' with '+money(max)+'!';
 } else { w.style.display='none'; }
}
function openQ(ci,r){
 let q=DATA[ci].questions[r];
 current={ci,r,key:ci+'-'+r,value:q.value,wrong:new Set()};
 document.getElementById('qcat').textContent=DATA[ci].name;
 document.getElementById('qvalue').textContent='$'+q.value;
 document.getElementById('question').textContent=q.q;
 document.getElementById('answerText').textContent=q.a;
 document.getElementById('note').textContent=q.note;
 document.getElementById('answer').style.display='none';
 document.getElementById('teamActions').style.display='none';
 resetTeamButtons();
 modal.style.display='flex';
}
function closeUsed(){if(current)used.add(current.key);current=null;modal.style.display='none';draw()}
document.getElementById('reveal').onclick=()=>{document.getElementById('answer').style.display='block';document.getElementById('teamActions').style.display='block'}
document.getElementById('back').onclick=()=>{modal.style.display='none';current=null}
document.querySelectorAll('[data-correct]').forEach(b=>b.onclick=()=>{if(!current)return;let t=+b.dataset.correct;scores[t]+=current.value;closeUsed()})
document.querySelectorAll('[data-wrong]').forEach(b=>b.onclick=()=>{
  if(!current)return;let t=+b.dataset.wrong;
  if(!current.wrong.has(t)){scores[t]-=current.value;current.wrong.add(t);update();b.disabled=true;b.textContent='Deducted'}
})
document.getElementById('nobody').onclick=closeUsed;
document.getElementById('reset').onclick=()=>{if(confirm('Reset this unit and all scores?')){scores=[0,0,0];used.clear();current=null;draw()}}
document.getElementById('adjust').onclick=()=>{for(let i=0;i<3;i++){let v=prompt('Team '+(i+1)+' score:',scores[i]);if(v!==null&&!isNaN(Number(v)))scores[i]=Number(v)}update()}
draw();
</script>
</body></html>
