<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultimate 3P Pathophysiology Jeopardy</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06142f,#102b63);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:1450px;margin:auto;padding:16px}.title{text-align:center;color:#ffd54f;font-size:clamp(28px,4vw,52px);font-weight:950;text-shadow:0 3px #000}.sub{text-align:center;color:#9cecf3;font-size:18px;font-weight:800;margin:5px 0 14px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.team{background:#0b2148;border:2px solid #1f6ba7;border-radius:12px;padding:9px;text-align:center}.team input{width:100%;background:transparent;border:0;border-bottom:1px solid #ffffff55;color:white;text-align:center;font-weight:900;font-size:17px}.score{font-size:28px;color:#ffd54f;font-weight:950;margin:5px}.mini button{margin:2px;border:0;border-radius:7px;padding:6px 10px;font-weight:900;cursor:pointer}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.cat{background:#7136b6;padding:12px 5px;text-align:center;font-weight:950;min-height:70px;display:flex;align-items:center;justify-content:center;border-radius:6px}.tile{background:#087c96;color:#ffd54f;border:0;border-radius:6px;min-height:83px;font-size:30px;font-weight:950;cursor:pointer;text-shadow:0 2px #000}.tile.used{background:#182c45;color:#60748d;cursor:default}.actions{text-align:center;margin:12px}.actions button,.btn{border:0;border-radius:8px;padding:10px 14px;margin:3px;font-weight:900;cursor:pointer}.reset{background:#d81b60;color:white}.modal{display:none;position:fixed;inset:0;background:#020817ee;padding:18px;overflow:auto;z-index:10}.card{max-width:950px;margin:4vh auto;background:#0b2148;border:3px solid #ffd54f;border-radius:18px;padding:24px;text-align:center}.value{color:#ffd54f;font-size:25px;font-weight:950}.question{font-size:clamp(22px,3vw,34px);font-weight:900;line-height:1.3;margin:22px 0}.answer{display:none;background:white;color:#10203b;border-radius:12px;padding:17px;margin:15px 0;font-size:21px}.answer .teach{font-size:16px;margin-top:9px;line-height:1.4}.reveal{background:#ffd54f;color:#111}.correct{background:#2da45c;color:#fff}.wrong{background:#d93b50;color:#fff}.pass{background:#7b42d1;color:#fff}.back{background:#2496b5;color:#fff}.teamRow{margin:7px}.winner{font-size:24px;color:#ffd54f;font-weight:950}@media(max-width:800px){.board{grid-template-columns:repeat(5,minmax(110px,1fr));overflow:auto}.scores{grid-template-columns:1fr}.wrap{padding:7px}}
</style></head><body><div class="wrap"><div class="title">PATHOPHYSIOLOGY JEOPARDY!</div><div class="sub">3P Review • Renal & Urologic Systems + Male Reproductive System</div><div class="scores" id="scores"></div><div class="board" id="board"></div><div class="actions"><button class="btn reset" id="reset">RESET GAME</button><button class="btn back" id="winner">SHOW WINNER</button></div><div id="wintext" class="winner" style="text-align:center"></div></div>
<div class="modal" id="modal"><div class="card"><div id="mvalue" class="value"></div><div id="mq" class="question"></div><button id="reveal" class="btn reveal">REVEAL ANSWER</button><div id="ans" class="answer"><b id="ma"></b><div id="note" class="teach"></div></div><div id="grading" style="display:none"></div><button id="back" class="btn back">BACK TO BOARD</button></div></div>
<script>const DATA=[{"name":"WHAT’S THE MECHANISM?","questions":[{"value":100,"q":"A patient with metabolic acidosis develops deep, rapid respirations. What mechanism explains this breathing pattern?","a":"Kussmaul respirations increase alveolar ventilation to lower PaCO₂ and compensate for metabolic acidosis.","note":"Memory anchor: metabolic acid rises → lungs blow off CO₂."},{"value":200,"q":"A patient with long-standing COPD develops right ventricular enlargement and peripheral edema. What pathophysiologic mechanism connects the lung disease to the heart findings?","a":"Chronic hypoxemia causes pulmonary vasoconstriction and pulmonary hypertension, increasing right-ventricular workload and producing cor pulmonale.","note":"Follow the pressure: diseased lungs → pulmonary hypertension → right-heart strain."},{"value":300,"q":"A patient with type 1 diabetes has glucose 480 mg/dL, ketones, dehydration, and metabolic acidosis. What mechanism is driving the acidosis?","a":"Insulin deficiency triggers lipolysis and hepatic ketone production, producing ketoacidosis.","note":"No usable insulin → fat becomes fuel → ketones accumulate."},{"value":400,"q":"A patient with cirrhosis develops ascites, splenomegaly, and esophageal varices. What underlying mechanism links these findings?","a":"Fibrosis and nodular regeneration increase resistance to portal blood flow, producing portal hypertension.","note":"The liver becomes a high-resistance pathway, so portal blood backs up."},{"value":500,"q":"A patient with rhabdomyolysis after prolonged muscle compression develops dark urine, hyperkalemia, and rising creatinine. What mechanism threatens the kidneys?","a":"Massive muscle breakdown releases myoglobin, which contributes to tubular injury and acute kidney injury.","note":"Muscle contents spill into blood; myoglobin is the renal danger signal."}]},{"name":"NAME THAT DISORDER","questions":[{"value":100,"q":"An older adult develops sudden fluctuating confusion and inattention during hospitalization for pneumonia. What disorder best fits?","a":"Delirium.","note":"Acute + fluctuating + impaired attention should immediately point toward delirium."},{"value":200,"q":"A patient has symmetric inflammatory joint pain, prolonged morning stiffness, and autoimmune synovitis. What disorder is most likely?","a":"Rheumatoid arthritis.","note":"RA is systemic autoimmune synovitis; osteoarthritis is primarily degenerative cartilage disease."},{"value":300,"q":"A patient has weight loss, heat intolerance, tachycardia, elevated T3/T4, suppressed TSH, and exophthalmos. What disorder is most likely?","a":"Graves disease.","note":"TSH-receptor stimulating antibodies drive thyroid hormone production despite suppressed pituitary TSH."},{"value":400,"q":"A patient has abdominal pain, diarrhea, and patchy transmural inflammation with skip lesions involving multiple areas of the GI tract. What disorder is most likely?","a":"Crohn disease.","note":"Transmural + skip lesions + anywhere in the GI tract = Crohn disease."},{"value":500,"q":"A patient has fatigable skeletal muscle weakness that worsens with activity. Autoantibodies target postsynaptic acetylcholine receptors. What disorder is this?","a":"Myasthenia gravis.","note":"The problem is at the neuromuscular junction: fewer functional postsynaptic ACh receptors."}]},{"name":"FOLLOW THE CLUES","questions":[{"value":100,"q":"Fever, dysuria, urinary frequency, and suprapubic discomfort occur without flank pain. Which part of the urinary tract is most likely involved?","a":"The bladder — cystitis.","note":"Lower-tract symptoms without systemic or flank findings point toward cystitis."},{"value":200,"q":"A patient has unilateral calf swelling after prolonged immobility. Which classic three-part framework explains the major factors that promote thrombosis?","a":"Virchow’s triad: venous stasis, endothelial injury, and hypercoagulability.","note":"Think clot risk in three buckets: flow, vessel wall, and blood."},{"value":300,"q":"A patient with chronic GERD develops metaplastic changes in the distal esophagus. What complication has developed, and why does it matter?","a":"Barrett esophagus; it increases the risk for esophageal adenocarcinoma.","note":"Chronic acid exposure can drive metaplasia; Barrett is the red-flag consequence."},{"value":400,"q":"A postoperative patient has suprapubic fullness, more than 900 mL retained urine, and rising creatinine that improves after catheterization. What type of AKI is this?","a":"Postrenal AKI from urinary obstruction.","note":"The improvement after relieving obstruction tells you where the problem was."},{"value":500,"q":"A septic patient begins bleeding from IV sites while also forming widespread microthrombi. Platelets and fibrinogen are low, PT/aPTT are prolonged, and D-dimer is elevated. What process is occurring?","a":"Disseminated intravascular coagulation (DIC).","note":"DIC consumes platelets and clotting factors while widespread coagulation is occurring."}]},{"name":"LABS DON’T LIE","questions":[{"value":100,"q":"A patient with suspected acute myocardial injury has several biomarkers ordered. Which marker is most closely associated with myocardial injury?","a":"Troponin.","note":"Troponin is the key biomarker in the clinical evaluation of myocardial injury."},{"value":200,"q":"A patient has macrocytic anemia plus neurologic symptoms. Which nutritional deficiency best fits this combination?","a":"Vitamin B12 deficiency.","note":"B12 and folate can both be macrocytic, but neurologic findings favor B12 deficiency."},{"value":300,"q":"A patient with chronic kidney disease has a normocytic anemia. Which kidney function has been lost that helps explain the anemia?","a":"Reduced erythropoietin production.","note":"Failing kidneys do more than lose filtration; they also lose endocrine functions."},{"value":400,"q":"A patient has heavy proteinuria, hypoalbuminemia, edema, and hyperlipidemia. Which glomerular syndrome does this pattern indicate?","a":"Nephrotic syndrome.","note":"Nephrotic = protein leak. Think heavy protein loss → low albumin → edema."},{"value":500,"q":"A patient with SIADH develops worsening neurologic symptoms. Which major electrolyte abnormality should you expect from excess water retention?","a":"Dilutional hyponatremia.","note":"SIADH retains water, diluting serum sodium and increasing cerebral edema risk."}]},{"name":"3P FINAL BOSS","questions":[{"value":100,"q":"Pulmonary function testing shows reduced lung volumes with a normal or increased FEV1/FVC ratio. Is this obstructive or restrictive physiology?","a":"Restrictive physiology.","note":"Restriction reduces volume; obstruction disproportionately reduces expiratory flow."},{"value":200,"q":"A patient develops an acutely painful, red first metatarsophalangeal joint. Monosodium urate crystals activate an inflammasome and trigger IL-1β release. What disorder is this?","a":"Gout.","note":"Crystal deposition is only the beginning; the intense pain comes from the inflammatory response it triggers."},{"value":300,"q":"A patient with Parkinson disease has bradykinesia, rigidity, and resting tremor. Degeneration of neurons in what structure drives the dopamine deficiency?","a":"The substantia nigra.","note":"Parkinson disease is tied to degeneration of dopaminergic neurons in the substantia nigra."},{"value":400,"q":"A patient has edema and hypertension with hematuria, reduced GFR, and proteinuria after inflammatory glomerular injury. Is this nephritic or nephrotic syndrome?","a":"Nephritic syndrome.","note":"Nephritic = inflamed glomerulus with blood leakage and reduced filtration; nephrotic = heavy protein leakage."},{"value":500,"q":"A patient with COPD, diabetes, CKD, and new sepsis becomes hypotensive and oliguric. Creatinine rises. Before naming the renal disorder, what physiologic question should guide your reasoning first?","a":"Is renal perfusion adequate? The hypotension and sepsis raise concern for prerenal AKI from decreased kidney perfusion.","note":"Final-boss strategy: start with physiology. Perfusion → filtration → excretion."}]}];let scores=[0,0,0],current=null,used=new Set(),wronged=new Set();
function drawScores(){let s=document.getElementById('scores');s.innerHTML='';scores.forEach((v,i)=>{let d=document.createElement('div');d.className='team';d.innerHTML=`<input value="TEAM ${i+1}" aria-label="Team name"><div class="score">$${v}</div><div class="mini"><button onclick="adj(${i},100)">+100</button><button onclick="adj(${i},-100)">−100</button></div>`;s.appendChild(d)})}function adj(i,n){scores[i]+=n;drawScores()}
function drawBoard(){let b=document.getElementById('board');b.innerHTML='';DATA.forEach(c=>{let d=document.createElement('div');d.className='cat';d.textContent=c.name;b.appendChild(d)});for(let r=0;r<5;r++)DATA.forEach((c,ci)=>{let q=c.questions[r],k=ci+'-'+r,bt=document.createElement('button');bt.className='tile'+(used.has(k)?' used':'');bt.textContent=used.has(k)?'':('$'+q.value);bt.onclick=()=>openQ(ci,r);b.appendChild(bt)})}
function openQ(ci,r){let k=ci+'-'+r;if(used.has(k))return;current={ci,r,k,q:DATA[ci].questions[r]};wronged=new Set();document.getElementById('mvalue').textContent=DATA[ci].name+' • $'+current.q.value;document.getElementById('mq').textContent=current.q.q;document.getElementById('ma').textContent=current.q.a;document.getElementById('note').textContent=current.q.note;document.getElementById('ans').style.display='none';document.getElementById('grading').style.display='none';document.getElementById('reveal').style.display='inline-block';document.getElementById('modal').style.display='block'}
document.getElementById('reveal').onclick=()=>{document.getElementById('ans').style.display='block';document.getElementById('grading').style.display='block';document.getElementById('reveal').style.display='none';let g=document.getElementById('grading');g.innerHTML='';scores.forEach((_,i)=>{let d=document.createElement('div');d.className='teamRow';d.innerHTML=`<b>TEAM ${i+1}</b> <button class="btn correct" onclick="right(${i})">✓ CORRECT</button> <button class="btn wrong" onclick="wrong(${i})">✕ INCORRECT</button>`;g.appendChild(d)});let p=document.createElement('button');p.className='btn pass';p.textContent='NO ONE GOT IT / PASS';p.onclick=finish;g.appendChild(p)}
function right(i){scores[i]+=current.q.value;finish()}function wrong(i){if(!wronged.has(i)){scores[i]-=current.q.value;wronged.add(i);drawScores()}}function finish(){used.add(current.k);document.getElementById('modal').style.display='none';drawScores();drawBoard()}
document.getElementById('back').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('reset').onclick=()=>{scores=[0,0,0];used.clear();document.getElementById('wintext').textContent='';drawScores();drawBoard()};document.getElementById('winner').onclick=()=>{let m=Math.max(...scores),ix=scores.map((v,i)=>v===m?i+1:null).filter(Boolean);document.getElementById('wintext').textContent=ix.length===1?`🏆 TEAM ${ix[0]} WINS WITH $${m}!`:`🏆 TIE: TEAMS ${ix.join(' & ')} WITH $${m}!`};drawScores();drawBoard();</script></body></html>
